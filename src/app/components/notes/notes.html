<div class="container py-5">
  <h1 class="text-center mb-4">My Notes</h1>

  <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
    {{ errorMessage }}
  </div>

  <div *ngIf="successMessage" class="alert alert-success" role="status">
    {{ successMessage }}
  </div>

  <div *ngIf="isLoading" class="text-center mb-4">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p>Loading notes...</p>
  </div>

  <div class="card shadow-sm mb-5">
    <div class="card-body">
      <h5 class="card-title mb-3">Add a new note</h5>

      <div class="mb-3">
        <label for="note-title" class="form-label">Title</label>
        <input
          #title
          id="note-title"
          type="text"
          class="form-control"
          placeholder="Enter note title"
          maxlength="100"
          [disabled]="isSaving"
        >
      </div>

      <div class="mb-3">
        <label for="note-text" class="form-label">Description</label>
        <textarea
          #text
          id="note-text"
          class="form-control"
          rows="4"
          placeholder="Enter note text"
          maxlength="5000"
          [disabled]="isSaving"
        ></textarea>
      </div>

      <button
        class="btn btn-primary"
        [disabled]="isSaving"
        (click)="addNote(title, text)"
      >
        {{ isSaving ? 'Saving...' : 'Add' }}
      </button>
    </div>
  </div>

  <div
    *ngIf="!isLoading && notes.length === 0 && !errorMessage"
    class="alert alert-info"
  >
    No notes yet
  </div>

  <div class="row g-4">
    <div
      *ngFor="let note of notes"
      class="col-12 col-md-6 col-lg-4"
    >
      <div class="card h-100 shadow-sm">
        <div class="card-body">
          <h5 class="card-title">{{ note.title }}</h5>
          <p class="card-text">{{ note.text }}</p>
        </div>

        <div class="card-footer bg-transparent border-0">
          <button
            class="btn btn-danger btn-sm"
            [disabled]="isLoading"
            (click)="deleteNote(note.id)"
          >
            Delete
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
